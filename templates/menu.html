<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurant Menu</title>
</head>
<body>

    <h1>Restaurant Ordering System</h1>
    <h2>Food Menu</h2>

    <ul>
        {% for item in items %}
            <li>{{ item.name }} - €{{ "%.2f"|format(item.price) }}</li>
        {% endfor %}
    </ul>

    <a href="{{ url_for('register') }}">Register</a>
    <a href="{{ url_for('login') }}">Login</a>

</body>
</html>
