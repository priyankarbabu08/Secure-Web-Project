<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Food Item</title>
</head>
<body>
    <h1>Restaurant Ordering System</h1>
    <h2>Edit Food Item</h2>

    <form action="{{ url_for('edit_item', item_id=item.id) }}" method="POST">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>Food Name:</label>
        <input type="text" name="name" value="{{ item.name }}" maxlength="100" required>

        <br><br>

        <label>Price (€):</label>
        <input type="number" name="price" value="{{ item.price }}" min="0.01" max="1000" step="0.01" required>

        <br><br>

        <button type="submit">Update Food Item</button>
    </form>

    <br>

    <a href="{{ url_for('manage_items') }}">Back to Manage Food Items</a>
</body>
</html>
